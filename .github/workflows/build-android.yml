name: Build Android APKs

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.20f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.20f1-android-3

jobs:
  # ── Build Heal (Therapeutic) variant ─────────────────────────────
  build-heal:
    name: Build Heal APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Heal)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Heal-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Heal-
            Library-Android-

      - name: Prepare license file
        run: |
          # Write ULF license to a file that can be mounted into Docker
          echo '${{ secrets.UNITY_LICENSE }}' > /tmp/unity_license.ulf

      - name: Activate and Build Heal APK
        run: |
          docker pull $UNITY_IMAGE

          docker run --rm \
            -v "$PWD:/project" \
            -v "/tmp/unity_license.ulf:/tmp/unity_license.ulf:ro" \
            -w /project \
            $UNITY_IMAGE \
            bash -c '
              set -e

              echo "=== Installing Unity License ==="
              mkdir -p /root/.local/share/unity3d/Unity
              cp /tmp/unity_license.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf
              echo "License file installed."

              echo "=== Verifying License ==="
              unity-editor -batchmode -nographics -quit -logFile /dev/stdout || true
              echo "License verification complete."

              echo "=== Building Heal APK ==="
              unity-editor -batchmode -nographics \
                -projectPath /project \
                -executeMethod EndlessBeloved.Editor.BuildScript.BuildHeal \
                -buildTarget Android \
                -logFile /dev/stdout \
                -quit
            '

      - name: Cleanup license
        if: always()
        run: rm -f /tmp/unity_license.ulf

      - name: Upload Heal APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Heal-APK
          path: build/Android/*.apk
          retention-days: 14

  # ── Build Dark (Fantasy) variant ────────────────────────────────
  build-dark:
    name: Build Dark APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Dark)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Dark-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Dark-
            Library-Android-

      - name: Prepare license file
        run: |
          echo '${{ secrets.UNITY_LICENSE }}' > /tmp/unity_license.ulf

      - name: Activate and Build Dark APK
        run: |
          docker pull $UNITY_IMAGE

          docker run --rm \
            -v "$PWD:/project" \
            -v "/tmp/unity_license.ulf:/tmp/unity_license.ulf:ro" \
            -w /project \
            $UNITY_IMAGE \
            bash -c '
              set -e

              echo "=== Installing Unity License ==="
              mkdir -p /root/.local/share/unity3d/Unity
              cp /tmp/unity_license.ulf /root/.local/share/unity3d/Unity/Unity_lic.ulf
              echo "License file installed."

              echo "=== Verifying License ==="
              unity-editor -batchmode -nographics -quit -logFile /dev/stdout || true
              echo "License verification complete."

              echo "=== Building Dark APK ==="
              unity-editor -batchmode -nographics \
                -projectPath /project \
                -executeMethod EndlessBeloved.Editor.BuildScript.BuildDark \
                -buildTarget Android \
                -logFile /dev/stdout \
                -quit
            '

      - name: Cleanup license
        if: always()
        run: rm -f /tmp/unity_license.ulf

      - name: Upload Dark APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Dark-APK
          path: build/Android/*.apk
          retention-days: 14
