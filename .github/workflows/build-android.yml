name: Build Android APKs

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.20f1

jobs:
  # ── Build Heal (Therapeutic) variant ─────────────────────────────
  build-heal:
    name: Build Heal APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Heal)
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-Heal-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Heal-
            Library-Android-

      - name: Build Heal APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          androidAppBundle: false
          buildMethod: EndlessBeloved.Editor.BuildScript.BuildHeal
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'user.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildName: EndlessBelovedHeal

      - name: Upload Heal APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Heal-APK
          path: build/Android/*.apk
          retention-days: 14

  # ── Build Dark (Fantasy) variant ────────────────────────────────
  build-dark:
    name: Build Dark APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Dark)
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-Android-Dark-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Dark-
            Library-Android-

      - name: Build Dark APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          androidAppBundle: false
          buildMethod: EndlessBeloved.Editor.BuildScript.BuildDark
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'user.keystore' || '' }}
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          buildName: EndlessBelovedDark

      - name: Upload Dark APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Dark-APK
          path: build/Android/*.apk
          retention-days: 14

  # ── Optional: Upload to itch.io ─────────────────────────────────
  deploy:
    name: Deploy to itch.io
    needs: [build-heal, build-dark]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download Heal APK
        uses: actions/download-artifact@v4
        with:
          name: EndlessBeloved-Heal-APK
          path: build/heal

      - name: Download Dark APK
        uses: actions/download-artifact@v4
        with:
          name: EndlessBeloved-Dark-APK
          path: build/dark

      - name: Upload to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler push build/heal/*.apk ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:android-heal
          ./butler push build/dark/*.apk ${{ secrets.ITCH_USER }}/${{ secrets.ITCH_GAME }}:android-dark
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
