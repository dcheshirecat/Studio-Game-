name: Build Android APKs

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.20f1
  UNITY_IMAGE: unityci/editor:ubuntu-2022.3.20f1-android-3

jobs:
  # ── Build Heal (Therapeutic) variant ─────────────────────────────
  build-heal:
    name: Build Heal APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Heal)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Heal-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Heal-
            Library-Android-

      - name: Activate and Build Heal APK
        run: |
          # Pull the Unity Docker image
          docker pull $UNITY_IMAGE

          # Run Unity: activate license with email/password, then build
          docker run --rm \
            -e UNITY_EMAIL="${{ secrets.UNITY_EMAIL }}" \
            -e UNITY_PASSWORD="${{ secrets.UNITY_PASSWORD }}" \
            -v "$PWD:/project" \
            -w /project \
            $UNITY_IMAGE \
            bash -c '
              set -e
              echo "=== Activating Unity License ==="
              unity-editor -batchmode -nographics \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -quit \
                -logFile /dev/stdout || true

              echo "=== Building Heal APK ==="
              unity-editor -batchmode -nographics \
                -projectPath /project \
                -executeMethod EndlessBeloved.Editor.BuildScript.BuildHeal \
                -buildTarget Android \
                -logFile /dev/stdout \
                -quit
            '

      - name: Upload Heal APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Heal-APK
          path: build/Android/*.apk
          retention-days: 14

  # ── Build Dark (Fantasy) variant ────────────────────────────────
  build-dark:
    name: Build Dark APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Dark)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Dark-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Dark-
            Library-Android-

      - name: Activate and Build Dark APK
        run: |
          # Pull the Unity Docker image
          docker pull $UNITY_IMAGE

          # Run Unity: activate license with email/password, then build
          docker run --rm \
            -e UNITY_EMAIL="${{ secrets.UNITY_EMAIL }}" \
            -e UNITY_PASSWORD="${{ secrets.UNITY_PASSWORD }}" \
            -v "$PWD:/project" \
            -w /project \
            $UNITY_IMAGE \
            bash -c '
              set -e
              echo "=== Activating Unity License ==="
              unity-editor -batchmode -nographics \
                -username "$UNITY_EMAIL" \
                -password "$UNITY_PASSWORD" \
                -quit \
                -logFile /dev/stdout || true

              echo "=== Building Dark APK ==="
              unity-editor -batchmode -nographics \
                -projectPath /project \
                -executeMethod EndlessBeloved.Editor.BuildScript.BuildDark \
                -buildTarget Android \
                -logFile /dev/stdout \
                -quit
            '

      - name: Upload Dark APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Dark-APK
          path: build/Android/*.apk
          retention-days: 14
