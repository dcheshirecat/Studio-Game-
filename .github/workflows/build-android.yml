name: Build Android APKs

on:
  push:
    branches: [main, feature/*]
  workflow_dispatch:

env:
  UNITY_VERSION: 2022.3.20f1

jobs:
  # ── Activate Unity License ──────────────────────────────────────
  activate:
    name: Activate Unity
    runs-on: ubuntu-latest
    outputs:
      license: ${{ steps.activate.outputs.license }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate Unity License
        id: activate
        uses: game-ci/unity-activate@v2
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

  # ── Build Heal (Therapeutic) variant ─────────────────────────────
  build-heal:
    name: Build Heal APK
    needs: activate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Heal)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Heal-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Heal-
            Library-Android-

      - name: Build Heal APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          androidAppBundle: false
          buildMethod: EndlessBeloved.Editor.BuildScript.BuildHeal
          buildName: EndlessBelovedHeal

      - name: Upload Heal APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Heal-APK
          path: build/Android/*.apk
          retention-days: 14

  # ── Build Dark (Fantasy) variant ────────────────────────────────
  build-dark:
    name: Build Dark APK
    needs: activate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library (Dark)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-Dark-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-Dark-
            Library-Android-

      - name: Build Dark APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: ${{ env.UNITY_VERSION }}
          androidAppBundle: false
          buildMethod: EndlessBeloved.Editor.BuildScript.BuildDark
          buildName: EndlessBelovedDark

      - name: Upload Dark APK
        uses: actions/upload-artifact@v4
        with:
          name: EndlessBeloved-Dark-APK
          path: build/Android/*.apk
          retention-days: 14
