<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aa4466"/>
      <stop offset="100%" stop-color="#662244"/>
    </linearGradient>
    <radialGradient id="face_glow" cx="50%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#aa4466" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="540" height="960" fill="transparent"/>
  <!-- Body silhouette -->
  <ellipse cx="270" cy="700" rx="160" ry="260" fill="url(#body)" opacity="0.8"/>
  <!-- Head -->
  <circle cx="265" cy="250" r="120" fill="#aa4466" opacity="0.9"/>
  <!-- Face glow -->
  <circle cx="265" cy="240" r="90" fill="url(#face_glow)"/>
  <!-- Eyes -->
  <line x1="200" y1="270" x2="235" y2="275" stroke="#fff" stroke-width="3" opacity="0.8"/><line x1="330" y1="270" x2="295" y2="275" stroke="#fff" stroke-width="3" opacity="0.8"/><ellipse cx="220" cy="285" rx="12" ry="10" fill="#fff" opacity="0.7"/><ellipse cx="310" cy="285" rx="12" ry="10" fill="#fff" opacity="0.7"/>
  <!-- Mouth hint -->
  <line x1="240" y1="320" x2="290" y2="320" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <!-- Label -->
  <text x="270" y="920" text-anchor="middle" fill="#888" font-size="18" font-family="sans-serif">APPRENTICE - angry</text>
</svg>