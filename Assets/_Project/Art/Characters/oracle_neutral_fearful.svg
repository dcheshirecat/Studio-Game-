<svg xmlns="http://www.w3.org/2000/svg" width="540" height="960" viewBox="0 0 540 960">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a3090"/>
      <stop offset="100%" stop-color="#3d1b6e"/>
    </linearGradient>
    <radialGradient id="face_glow" cx="50%" cy="35%" r="30%">
      <stop offset="0%" stop-color="#6a3090" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="540" height="960" fill="transparent"/>
  <!-- Body silhouette -->
  <ellipse cx="270" cy="700" rx="160" ry="260" fill="url(#body)" opacity="0.8"/>
  <!-- Head -->
  <circle cx="265" cy="250" r="120" fill="#6a3090" opacity="0.9"/>
  <!-- Face glow -->
  <circle cx="265" cy="240" r="90" fill="url(#face_glow)"/>
  <!-- Eyes -->
  <ellipse cx="220" cy="278" rx="18" ry="15" fill="#fff" opacity="0.9"/><ellipse cx="310" cy="278" rx="18" ry="15" fill="#fff" opacity="0.9"/><circle cx="220" cy="280" r="6" fill="#000"/><circle cx="310" cy="280" r="6" fill="#000"/>
  <!-- Mouth hint -->
  <line x1="240" y1="320" x2="290" y2="320" stroke="#fff" stroke-width="2" opacity="0.3"/>
  <!-- Label -->
  <text x="270" y="920" text-anchor="middle" fill="#888" font-size="18" font-family="sans-serif">ORACLE - fearful</text>
</svg>