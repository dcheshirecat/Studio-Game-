<svg xmlns="http://www.w3.org/2000/svg" width="300" height="500" viewBox="0 0 300 500">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
  </defs>
  <rect width="300" height="500" rx="15" fill="url(#cbg)" stroke="#88aacc" stroke-width="2"/>
  <rect x="15" y="15" width="270" height="470" rx="10" fill="none" stroke="#88aacc" stroke-width="1" opacity="0.4"/>
  <!-- Number -->
  <text x="150" y="60" text-anchor="middle" fill="#88aacc" font-size="28" font-family="serif">XIV</text>
  <!-- Central art area -->
  <rect x="40" y="80" width="220" height="300" rx="8" fill="#111122" stroke="#88aacc" stroke-width="1" opacity="0.5"/>
  <text x="150" y="240" text-anchor="middle" fill="#88aacc" font-size="48" font-family="serif" opacity="0.4">XIV</text>
  <!-- Card name -->
  <text x="150" y="430" text-anchor="middle" fill="#ddd" font-size="22" font-family="serif">Temperance</text>
  <!-- Decorative line -->
  <line x1="60" y1="450" x2="240" y2="450" stroke="#88aacc" stroke-width="1" opacity="0.3"/>
</svg>